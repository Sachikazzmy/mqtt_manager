per_listener_settings false
allow_anonymous false

persistence true
persistence_location /mosquitto/data/
persistence_file mosquitto.db
autosave_interval 30

listener 8883 0.0.0.0
protocol mqtt
certfile /run/secrets/mosquitto_server_cert
keyfile /run/secrets/mosquitto_server_key
tls_version tlsv1.2

# Cloudflare terminates public WSS; Compose exposes this only on host loopback.
# Both listeners share the same authentication and topic ACLs.
listener 9001 0.0.0.0
protocol websockets

# Payload size and complete MQTT packet size are separate broker limits.
message_size_limit 65536
max_packet_size 66000
retain_available false

plugin /usr/lib/mosquitto_dynamic_security.so
plugin_opt_config_file /mosquitto/data/dynamic-security.json
plugin_opt_password_init_file /run/secrets/dynsec_admin_password
